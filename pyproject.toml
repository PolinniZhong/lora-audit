[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-audit"
version = "0.1.0"
description = "只读审计视图：看一眼你的 LoRA 训练文件夹有没有 caption 遗漏、重复和触发词漂移"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["lora", "dataset", "caption", "kohya", "ai-toolkit", "stable-diffusion", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
# 零必需依赖：只用标准库。审计只需要读文件 + 正则 + 写 HTML。
dependencies = []

[project.optional-dependencies]
# 预留：缩略图/内联图片通道需要图像库，不进默认安装
thumbs = ["Pillow>=9"]
dev = []

[project.urls]
Homepage = "https://github.com/PolinniZhong/lora-audit"
Repository = "https://github.com/PolinniZhong/lora-audit"
Issues = "https://github.com/PolinniZhong/lora-audit/issues"
Changelog = "https://github.com/PolinniZhong/lora-audit/blob/main/CHANGELOG.md"

[project.scripts]
lora-audit = "lora_audit.cli:main"

[tool.setuptools]
packages = ["lora_audit"]

[tool.setuptools.package-data]
lora_audit = ["static/*.css", "static/*.js"]
