:root {

  --alc-r-4: 9px; --alc-r-5: 10px; --alc-r-6: 12px; --alc-r-pill: 999px;

:root[data-alc-theme="light"] {
  color-scheme: light;

  --alc-gray-1:  #FFFFFF;
  --alc-gray-2:  #F6F7F9;
  --alc-gray-3:  #FFFFFF;
  --alc-gray-4:  #F1F3F6;
  --alc-gray-5:  #E9ECF1;
  --alc-gray-6:  #E4E7ED;
  --alc-gray-7:  #D3D8E0;
  --alc-gray-8:  #A8B1C0;
  --alc-gray-9:  #6B7488;
  --alc-gray-10: #5A6274;
  --alc-gray-11: #4E5566;
  --alc-gray-12: #171A20;

  --alc-brand-hover: #1751AC;

  --alc-state-error: #B3261E;
  --alc-state-error-bg: rgba(179, 38, 30, 0.10);
  --alc-state-error-border: rgba(179, 38, 30, 0.30);
  --alc-state-info: #1D63CC;
  --alc-state-info-bg: rgba(29, 99, 204, 0.10);

  --alc-shadow-3: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.07);

  --alc-focus-ring: 0 0 0 3px rgba(29, 99, 204, 0.18);

/* ------------------------------------------------------------------ 基础 */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
button, a, input, summary { touch-action: manipulation; }
body {
  margin: 0;
  background: var(--alc-bg-canvas);
  color: var(--alc-fg-primary);
  font: var(--alc-fw-regular) var(--alc-fs-base)/var(--alc-lh-normal) var(--alc-font-sans);
}
a { color: var(--alc-brand-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible {
  outline: none;
  box-shadow: var(--alc-focus-ring);
  border-radius: var(--alc-r-2);
}
button:focus-visible, input:focus-visible, a:focus-visible { scroll-margin-top: var(--la-sticky-h); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

.alc-skip {
  position: absolute; left: var(--alc-sp-7); top: -100px; z-index: 60;
  background: var(--alc-bg-elevated); color: var(--alc-fg-primary);
  border: 1px solid var(--alc-border-strong); border-radius: var(--alc-r-3);
  padding: var(--alc-sp-4) var(--alc-sp-6); font-size: var(--alc-fs-sm);
  transition: top var(--alc-dur-fast) var(--alc-ease);
}
.alc-skip:focus { top: var(--alc-sp-7); text-decoration: none; }

.alc-app { min-height: 100vh; display: flex; flex-direction: column; }

/* ------------------------------------------------- 顶栏（唯一粘滞层） */
.alc-topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--alc-bg-canvas);
  border-bottom: 1px solid var(--alc-border-default);
}
.alc-head {
  background: var(--alc-bg-base);
  padding: var(--alc-sp-5) var(--alc-sp-9);
}
.alc-head-main { display: flex; align-items: center; justify-content: space-between; gap: var(--alc-sp-5); }
.alc-brand {
  margin: 0;
  font-size: var(--alc-fs-lg); font-weight: var(--alc-fw-semibold);
  letter-spacing: 0.01em; display: inline-flex; align-items: center; gap: var(--alc-sp-3);
  min-width: 0;
}
.alc-brand-mark {
  width: 9px; height: 9px; border-radius: var(--alc-r-pill);
  background: var(--alc-brand-primary); flex: none;
}
.alc-head-right { display: flex; align-items: center; gap: var(--alc-sp-5); min-width: 0; }
.alc-head-meta {
  font-size: var(--alc-fs-sm); color: var(--alc-fg-tertiary);
  font-family: var(--alc-font-mono);
  max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  direction: rtl; text-align: left;
}
.alc-icon-btn {
  background: transparent; border: 1px solid transparent; color: var(--alc-fg-secondary);
  border-radius: var(--alc-r-2); width: 26px; height: 26px; cursor: pointer;
  font-size: var(--alc-fs-md); line-height: 1; display: inline-flex;
  align-items: center; justify-content: center; flex: none;
  transition: background var(--alc-dur-fast) var(--alc-ease);
}
.alc-icon-btn:hover { background: var(--alc-bg-elevated); color: var(--alc-fg-primary); }

.alc-metabar, .alc-toolbar {
  display: flex; align-items: center; gap: var(--alc-sp-3);
  padding: var(--alc-sp-3) var(--alc-sp-9);
  border-top: 1px solid var(--alc-border-subtle);
  background: var(--alc-bg-canvas);
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
}
.alc-toolbar { flex-wrap: wrap; overflow: visible; }
.alc-metabar::-webkit-scrollbar { display: none; }

/* 摘要芯片 */
.la-chips { display: flex; align-items: center; gap: var(--alc-sp-2); flex-wrap: nowrap; }
.la-chip {
  display: inline-flex; align-items: center; gap: var(--alc-sp-2);
  padding: var(--alc-sp-1) var(--alc-sp-4);
  border: 1px solid var(--alc-border-subtle); border-radius: var(--alc-r-pill);
  background: var(--alc-bg-inset); color: var(--alc-fg-secondary);
  font-size: var(--alc-fs-sm); white-space: nowrap;
}
.la-chip b { color: var(--alc-fg-primary); font-weight: var(--alc-fw-semibold); font-variant-numeric: tabular-nums; }
.la-chip.is-error { background: var(--alc-state-error-bg); border-color: var(--alc-state-error-border); color: var(--alc-state-error); }
.la-chip.is-error b { color: var(--alc-state-error); }
.la-chip.is-warn { background: var(--alc-state-warn-bg); border-color: var(--alc-state-warn-border); color: var(--alc-state-warn); }
.la-chip.is-warn b { color: var(--alc-state-warn); }
.la-chip.is-ok { background: var(--alc-state-success-bg); border-color: var(--alc-state-success-border); color: var(--alc-state-success); }
.la-chip.is-ok b { color: var(--alc-state-success); }

/* 搜索 */
.la-search { position: relative; flex: 1 1 220px; min-width: 180px; }
.la-search input {
  width: 100%; padding: var(--alc-sp-2) var(--alc-sp-8) var(--alc-sp-2) var(--alc-sp-5);
  background: var(--alc-bg-inset); color: var(--alc-fg-primary);
  border: 1px solid var(--alc-border-subtle); border-radius: var(--alc-r-3);
  font: inherit; font-size: var(--alc-fs-sm);
}
.la-search input::placeholder { color: var(--alc-fg-tertiary); }
.la-search::after {
  content: "⌕"; position: absolute; right: var(--alc-sp-4); top: 50%;
  transform: translateY(-50%); color: var(--alc-fg-tertiary);
  font-size: var(--alc-fs-md); pointer-events: none;
}

/* 筛选按钮 */
.la-filters { display: flex; align-items: center; gap: var(--alc-sp-2); flex-wrap: wrap; }
.alc-btn {
  display: inline-flex; align-items: center; gap: var(--alc-sp-2);
  padding: var(--alc-sp-2) var(--alc-sp-5);
  background: var(--alc-bg-inset); color: var(--alc-fg-secondary);
  border: 1px solid var(--alc-border-subtle); border-radius: var(--alc-r-pill);
  font: inherit; font-size: var(--alc-fs-sm); cursor: pointer;
  transition: background var(--alc-dur-fast) var(--alc-ease), border-color var(--alc-dur-fast) var(--alc-ease), color var(--alc-dur-fast) var(--alc-ease);
}
.alc-btn:hover { border-color: var(--alc-border-strong); color: var(--alc-fg-primary); }
.alc-btn[aria-pressed="true"] {
  background: var(--alc-brand-bg); border-color: var(--alc-border-strong);
  color: var(--alc-fg-primary);
}
.alc-btn .la-dot { width: 7px; height: 7px; border-radius: var(--alc-r-pill); background: currentColor; flex: none; }
.alc-btn.is-error { color: var(--alc-state-error); }
.alc-btn.is-warn { color: var(--alc-state-warn); }
.alc-btn.is-info { color: var(--alc-state-info); }

/* ----------------------------------------------------------------- 主体 */
.alc-main { flex: 1 0 auto; padding: var(--alc-sp-9); max-width: 1500px; width: 100%; margin: 0 auto; }
.la-section + .la-section { margin-top: var(--alc-sp-9); }
.la-h2 {
  margin: 0 0 var(--alc-sp-5);
  font-size: var(--alc-fs-md); font-weight: var(--alc-fw-semibold);
  display: flex; align-items: baseline; gap: var(--alc-sp-4);
}
.la-h2-note { font-size: var(--alc-fs-sm); font-weight: var(--alc-fw-regular); color: var(--alc-fg-tertiary); }

/* 检查结果卡片。多列而不是单列长条：问题多的时候（真实数据集十几条很常见），
   单列会把图片区推到几千像素之下，用户第一屏就看不到自己的图。 */
.la-findings { display: grid; gap: var(--alc-sp-4); grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
.la-finding {
  background: var(--alc-bg-surface);
  border: 1px solid var(--alc-border-subtle);
  border-left: 3px solid var(--alc-border-default);
  border-radius: var(--alc-r-4);
  padding: var(--alc-sp-6);
  box-shadow: var(--alc-shadow-card);
  transition: border-color var(--alc-dur-fast) var(--alc-ease);
}
.la-finding:hover { border-color: var(--alc-border-strong); }
.la-finding.sev-error { border-left-color: var(--alc-state-error); }
.la-finding.sev-warn { border-left-color: var(--alc-state-warn); }
.la-finding.sev-info { border-left-color: var(--alc-state-info); }
.la-finding.is-ok { border-left-color: var(--alc-state-success); }

.la-f-head { display: flex; align-items: center; gap: var(--alc-sp-3); flex-wrap: wrap; }
.la-f-id {
  font-family: var(--alc-font-mono); font-size: var(--alc-fs-xs);
  padding: 1px var(--alc-sp-2); border-radius: var(--alc-r-1);
  background: var(--alc-bg-inset); color: var(--alc-fg-tertiary);
  border: 1px solid var(--alc-border-subtle);
}
.la-f-title { font-weight: var(--alc-fw-semibold); font-size: var(--alc-fs-base); }
.sev-error .la-f-title { color: var(--alc-state-error); }
.sev-warn .la-f-title { color: var(--alc-state-warn); }
.sev-info .la-f-title { color: var(--alc-state-info); }
.la-f-count {
  margin-left: auto; font-size: var(--alc-fs-sm); color: var(--alc-fg-tertiary);
  font-variant-numeric: tabular-nums;
}
.la-f-detail { margin: var(--alc-sp-4) 0 0; color: var(--alc-fg-secondary); line-height: var(--alc-lh-snug); }
.la-f-action {
  margin: var(--alc-sp-4) 0 0; padding-left: var(--alc-sp-5);
  border-left: 2px solid var(--alc-border-subtle);
  color: var(--alc-fg-tertiary); font-size: var(--alc-fs-sm);
}
.la-f-action::before { content: "怎么办 · "; color: var(--alc-fg-secondary); }
.la-f-links { margin-top: var(--alc-sp-4); display: flex; gap: var(--alc-sp-2); flex-wrap: wrap; }
.la-f-links .alc-btn { font-size: var(--alc-fs-xs); padding: 3px var(--alc-sp-4); }
.la-f-more-box { margin-top: var(--alc-sp-4); font-size: var(--alc-fs-xs); }
.la-f-more-box summary { cursor: pointer; color: var(--alc-fg-secondary); }
.la-f-files {
  margin: var(--alc-sp-3) 0 0; padding-left: var(--alc-sp-6);
  color: var(--alc-fg-tertiary); font-family: var(--alc-font-mono);
  max-height: 180px; overflow: auto;
}
.la-f-files li { word-break: break-all; }
.la-f-more { color: var(--alc-fg-tertiary); font-style: italic; }
code {
  font-family: var(--alc-font-mono); font-size: 0.94em;
  background: var(--alc-bg-inset); border: 1px solid var(--alc-border-subtle);
  border-radius: var(--alc-r-1); padding: 0 4px;
}

/* ----------------------------------------------------------------- 网格 */
.la-grid {
  display: grid; gap: var(--alc-sp-5);
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
}
.la-tile {
  background: var(--alc-bg-surface);
  border: 1px solid var(--alc-border-subtle);
  border-radius: var(--alc-r-4);
  overflow: hidden; cursor: pointer; padding: 0; text-align: left;
  color: inherit; font: inherit;
  box-shadow: var(--alc-shadow-card);
  transition: border-color var(--alc-dur-fast) var(--alc-ease), box-shadow var(--alc-dur-fast) var(--alc-ease);
  display: flex; flex-direction: column;
}
.la-tile:hover { border-color: var(--alc-border-strong); box-shadow: var(--alc-shadow-hover); }
.la-frame {
  /* 白底资产衬底：白图不会糊进浅色页面背景 */
  background: var(--alc-media-mat);
  border-bottom: 1px solid var(--alc-border-subtle);
  aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.la-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.la-tile-body { padding: var(--alc-sp-3) var(--alc-sp-4) var(--alc-sp-4); }
.la-tile-name {
  font-family: var(--alc-font-mono); font-size: var(--alc-fs-xs);
  color: var(--alc-fg-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.la-tile-cap {
  margin-top: 3px; font-size: var(--alc-fs-xs); color: var(--alc-fg-tertiary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; line-height: 1.4; min-height: 2.8em;
}
.la-tile-badges { margin-top: var(--alc-sp-2); display: flex; gap: 3px; flex-wrap: wrap; }
.la-badge {
  font-size: 10px; font-family: var(--alc-font-mono); line-height: 1.6;
  padding: 0 5px; border-radius: var(--alc-r-1);
  border: 1px solid var(--alc-border-subtle); color: var(--alc-fg-tertiary);
}
.la-badge.e { color: var(--alc-state-error); border-color: var(--alc-state-error-border); background: var(--alc-state-error-bg); }
.la-badge.w { color: var(--alc-state-warn); border-color: var(--alc-state-warn-border); background: var(--alc-state-warn-bg); }
.la-badge.none { color: var(--alc-state-error); border-color: var(--alc-state-error-border); background: var(--alc-state-error-bg); }

.la-empty { color: var(--alc-fg-tertiary); font-size: var(--alc-fs-sm); }
.la-done { display: flex; align-items: center; gap: var(--alc-sp-3); color: var(--alc-state-success); }

/* ----------------------------------------------------------------- 页脚 */
.alc-foot {
  border-top: 1px solid var(--alc-border-subtle);
  padding: var(--alc-sp-7) var(--alc-sp-9);
  color: var(--alc-fg-tertiary); font-size: var(--alc-fs-sm);
  display: flex; flex-direction: column; gap: var(--alc-sp-2);
}
.alc-foot-hint { color: var(--alc-fg-tertiary); opacity: 0.85; }

/* ------------------------------------------------------------ 抽屉 / 灯箱 */
.alc-drawer {
  position: fixed; inset: 0; z-index: 40;
  background: var(--alc-scrim);
  display: flex; justify-content: flex-end;
  overscroll-behavior: contain;
}
.alc-drawer[hidden], .alc-lightbox[hidden] { display: none; }
.alc-drawer-panel {

      f.count ? el("span", { class: "la-f-count", text: f.count + " 张" + (f.truncated ? "（另 " + f.truncated + " 张未列出）" : "") }) : null
    ]);
    var kids = [head, el("p", { class: "la-f-detail" }, [richText(f.detail)])];
    if (f.action) kids.push(el("p", { class: "la-f-action" }, [richText(f.action)]));
    if (f.kind === "image" && f.items && f.items.length) {
      kids.push(el("div", { class: "la-f-links" }, [
        el("button", {
          class: "alc-btn", type: "button", dataset: { focusFinding: f.id },
          text: "只看这 " + f.items.length + " 张"
        })
      ]));
    } else if (f.items && f.items.length) {
      // 路径类条目（杂物文件 / 孤儿 caption / 清单里的死链）：给清单，不给筛图按钮
      var list = el("ul", { class: "la-f-files" });
      f.items.forEach(function (p) { list.appendChild(el("li", { text: p })); });
      if (f.truncated) {
        list.appendChild(el("li", { class: "la-f-more", text: "…还有 " + f.truncated + " 个" }));
      }
      kids.push(el("details", { class: "la-f-more-box" }, [
        el("summary", { text: "列出这 " + f.items.length + " 个路径" }), list
      ]));
    }
    findingsBox.appendChild(el("div", { class: "la-finding sev-" + f.sev }, kids));
  });

  /* ------------------------------------------------------------------ 筛选 */
  var filtersBox = q('[data-bind="filters"]');
  var state = { q: "", find: null };
  var filterBtns = [];

  function makeFilter(id, label, cls, count) {
    var btn = el("button", {
      class: "alc-btn" + (cls ? " " + cls : ""), type: "button",
      "aria-pressed": "false", dataset: { filterId: id === null ? "" : id }
    }, [
      cls ? el("span", { class: "la-dot" }) : null,
      label, count !== undefined ? " (" + count + ")" : null
    ]);
    filterBtns.push(btn);
    filtersBox.appendChild(btn);
    return btn;
  }

  makeFilter(null, "全部", null, D.images.length);
  relevant.forEach(function (f) {
    makeFilter(f.id, f.id + " " + f.title, "is-" + f.sev, f.items.length);
  });

  filtersBox.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-filter-id]");
    if (!btn) return;
    var id = btn.dataset.filterId || null;
    state.find = (state.find === id) ? null : id;
    syncFilters();
    scheduleRender(true);
  });

  function syncFilters() {
    filterBtns.forEach(function (b) {
      var id = b.dataset.filterId || null;
      b.setAttribute("aria-pressed", String(id === state.find));
    });
  }

  findingsBox.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-focus-finding]");
    if (!btn) return;
    state.find = btn.dataset.focusFinding;
    syncFilters();
    scheduleRender(true);
    document.getElementById("la-grid-h").scrollIntoView({ block: "start" });
  });

  /* ------------------------------------------------------------------ 搜索 */
  var qInput = document.getElementById("la-q");
  var searchTimer = null;
  qInput.addEventListener("input", function () {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = qInput.value.trim().toLowerCase();
      scheduleRender(true);
    }, 120);
  });

  /* ------------------------------------------------------------------ 网格 */
  var grid = q('[data-bind="grid"]');
  var emptyMsg = q('[data-bind="empty"]');
  var gridCount = q('[data-bind="grid-count"]');
  var CHUNK = 240;          // 小数据集一次渲染完；大数据集分批，避免首屏卡顿
  var CHUNK_AT = 400;       // 超过这个数量才启用分批
  var rendered = 0;
  var matched = [];         // 命中筛选的图片下标（存下标，避免 indexOf 的 O(n²)）

  function match(img) {
    if (state.find && img.findings.indexOf(state.find) === -1) return false;
    if (state.q) {
      var hay = (img.rel + " " + (img.caption || "") + " " + (img.trigger || "")).toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function makeTile(idx) {
    var img = D.images[idx];
    var imgEl = el("img", {
      src: srcUrl(img.src), alt: img.name, loading: "lazy", decoding: "async"
    });
    imgEl.addEventListener("error", function () {
      imgEl.replaceWith(el("span", {
        class: "la-tile-cap", text: "图片读不出来（已被移动或删除）"
      }));
    });
    var badges = [];
    if (img.capSource === "none") badges.push(el("span", { class: "la-badge none", text: "无 caption" }));
    else if (img.capSource === "default") badges.push(el("span", { class: "la-badge w", text: "default 兜底" }));
    img.findings.slice(0, 4).forEach(function (id) {
      badges.push(el("span", {
        class: "la-badge " + (id.charAt(0) === "E" ? "e" : "w"), text: id
      }));
    });
    var capText = img.caption ? img.caption.trim() : "（没有 caption）";
    return el("button", {
      class: "la-tile", type: "button", dataset: { idx: String(idx) }, title: img.rel
    }, [
      el("span", { class: "la-frame" }, [imgEl]),
      el("span", { class: "la-tile-body" }, [
        el("span", { class: "la-tile-name", text: img.name }),
        el("span", { class: "la-tile-cap", text: capText }),
        badges.length ? el("span", { class: "la-tile-badges" }, badges) : null
      ])
    ]);
  }

  function appendChunk() {
    var chunked = matched.length > CHUNK_AT;
    var size = chunked ? CHUNK : matched.length;
    var end = Math.min(rendered + size, matched.length);
    var frag = document.createDocumentFragment();
    for (var i = rendered; i < end; i++) frag.appendChild(makeTile(matched[i]));
    grid.appendChild(frag);
    rendered = end;
    if (chunked) grid.appendChild(sentinel);   // 哨兵始终留在末尾
    gridCount.textContent = "显示 " + rendered + " / 共 " + matched.length + " 张"
      + (matched.length !== D.images.length ? "（已按筛选）" : "");
  }

  var sentinel = el("div", { class: "la-sentinel", "aria-hidden": "true" });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting && rendered < matched.length) appendChunk();
    }, { rootMargin: "600px" }).observe(sentinel);
  }

  function scheduleRender(reset) {
    if (reset) {
      grid.textContent = "";
      rendered = 0;
    }
    matched = [];
    for (var i = 0; i < D.images.length; i++) {
      if (match(D.images[i])) matched.push(i);
    }
    emptyMsg.hidden = matched.length > 0;
    appendChunk();
  }

  /* ------------------------------------------------------------ 抽屉 / 灯箱 */
  var drawer = document.getElementById("la-drawer");
  var lb = document.getElementById("la-lightbox");
  var lastFocus = null;

  function kv(dt, dd, mono) {
    return [el("dt", { text: dt }),
            el("dd", { class: mono ? "alc-mono" : null, text: dd })];
  }

  function openDrawer(img) {
    lastFocus = document.activeElement;
    var body = q('[data-bind="drawer-body"]');
    body.textContent = "";
    q("#la-drawer-title").textContent = img.name;

    var dl = el("dl", { class: "la-kv" });
    kv("路径", img.rel, true).forEach(function (n) { dl.appendChild(n); });
    kv("分组", img.group || "（根目录）").forEach(function (n) { dl.appendChild(n); });
    kv("尺寸", (img.w && img.h) ? img.w + " × " + img.h : "读不出").forEach(function (n) { dl.appendChild(n); });
    kv("体积", humanBytes(img.bytes)).forEach(function (n) { dl.appendChild(n); });
    kv("caption 来源", img.capSource === "sidecar" ? "同名文件" :
      (img.capSource === "default" ? "继承 default_caption" : "无")).forEach(function (n) { dl.appendChild(n); });
    if (img.captionRel) kv("caption 文件", img.captionRel, true).forEach(function (n) { dl.appendChild(n); });
    kv("触发词", img.trigger || "（没有）", true).forEach(function (n) { dl.appendChild(n); });
    if (img.findings.length) kv("命中规则", img.findings.join(" · "), true).forEach(function (n) { dl.appendChild(n); });
    body.appendChild(dl);

    body.appendChild(el("div", {
      class: "la-cap-box" + (img.caption ? "" : " is-empty"),
      text: img.caption ? img.caption.trim() : "这张图没有 caption"
    }));

    var actions = el("div", { class: "la-drawer-actions" });
    if (img.caption) {
      var copyBtn = el("button", { class: "alc-btn", type: "button", text: "复制 caption" });
      copyBtn.addEventListener("click", function () { copyText(img.caption, copyBtn); });
      actions.appendChild(copyBtn);
    }
    var openBtn = el("button", { class: "alc-btn", type: "button", text: "看大图" });
    openBtn.addEventListener("click", function () { openLightbox(img); });
    actions.appendChild(openBtn);
    body.appendChild(actions);

    body.appendChild(el("div", { class: "la-preview" }, [
      el("img", { src: srcUrl(img.src), alt: img.name, loading: "lazy" })
    ]));

    drawer.hidden = false;
    var closeBtn = drawer.querySelector('[data-close="drawer"]');
    if (closeBtn) closeBtn.focus();
  }

  function copyText(text, btn) {
    var done = function (ok) {
      var old = btn.textContent;
      btn.textContent = ok ? "已复制 ✓" : "复制失败";
      setTimeout(function () { btn.textContent = old; }, 1400);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); },
          function () { done(fallbackCopy(text)); });
      } else {
        done(fallbackCopy(text));
      }
    } catch (e) { done(fallbackCopy(text)); }
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  function openLightbox(img) {
    q('[data-bind="lb-img"]').src = srcUrl(img.src);
    q('[data-bind="lb-img"]').alt = img.name;
    var cap = q('[data-bind="lb-cap"]');
    cap.textContent = "";
    cap.appendChild(el("div", { text: img.rel }));
    if (img.caption) cap.appendChild(el("div", { text: img.caption.trim() }));
    lb.hidden = false;
    lb.querySelector('[data-close="lightbox"]').focus();
  }

  function closeAll() {
    drawer.hidden = true;
    lb.hidden = true;
    q('[data-bind="lb-img"]').removeAttribute("src");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  grid.addEventListener("click", function (ev) {
    var tile = ev.target.closest(".la-tile");
    if (!tile) return;
    var img = D.images[Number(tile.dataset.idx)];
    if (img) openDrawer(img);
  });

  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-close]");
    if (btn) closeAll();
    if (ev.target === drawer || ev.target === lb) closeAll();
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeAll();
  });

  /* ------------------------------------------------------------------ 主题 */
  var themeBtn = document.getElementById("la-theme");
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-alc-theme");
      var next = cur === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-alc-theme", next);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", next === "light" ? "#FFFFFF" : "#0D0F13");
    });
  }

  /* 顶栏高多少，focus 的 scroll-margin 就留多少——不写死数字。
     （踩过的坑：三处写死 top 值 → 2px 缝隙 + 导航被压住。所以这里算，不写死。） */
  var topbar = document.querySelector(".alc-topbar");
  function syncStickyHeight() {
    if (topbar) {
      document.documentElement.style.setProperty(
        "--la-sticky-h", topbar.offsetHeight + "px");
    }
  }
  syncStickyHeight();
  window.addEventListener("resize", syncStickyHeight);

  scheduleRender(true);
  syncStickyHeight();
})();

</script>
</body>
</html>
